# Local development dependencies only (Postgres + a lightweight DB GUI).
# The app itself runs with `npm run dev` on the host during development.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: intern
      POSTGRES_PASSWORD: intern
      POSTGRES_DB: intern
    ports:
      - "5432:5432"
    volumes:
      - intern_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intern -d intern"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  intern_pgdata:
